name: Sync to CNB
on: [push]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Sync to CNB Repository
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL="https://cnb.cool/DylanLIIIII/LaunchDock.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD=${{ secrets.GIT_PASSWORD }} \
            -e PLUGIN_FORCE="true" \
            tencentcom/git-sync

      - name: Sync tags to CNB Repository
        env:
          CNB_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: |
          AUTH_HEADER=$(printf "cnb:%s" "$CNB_PASSWORD" | base64 -w 0)
          git ls-remote --tags --refs https://cnb.cool/DylanLIIIII/LaunchDock.git \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' > /tmp/cnb-tags.txt

          while read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            if grep -Fxq "$tag" /tmp/cnb-tags.txt; then
              echo "Tag $tag already exists on CNB, skipping."
              continue
            fi
            git -c "http.https://cnb.cool/.extraheader=Authorization: Basic $AUTH_HEADER" \
              push https://cnb.cool/DylanLIIIII/LaunchDock.git "refs/tags/$tag:refs/tags/$tag"
          done < <(git tag --list)
